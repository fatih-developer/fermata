name: release

# Push a tag like v0.3.0 to publish a GitHub Release with every package and SHA256SUMS.txt,
# which `fermata update` and the desktop app's update check consume.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-latest, rid: win-arm64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-latest, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release
        if: matrix.rid == 'linux-x64'
      - run: scripts/package.sh ${{ matrix.rid }} "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.rid }}
          path: artifacts/package/fermata-*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: |
          cd dist
          sha256sum fermata-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Fermata ${GITHUB_REF_NAME#v}" \
            --generate-notes $prerelease
